<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Collage</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
body {
  font-family: 'Roboto', sans-serif;
  margin: 0;
  padding: 0;
  background: #0d0d0d;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  color: #fff;
}

h1 {
  margin-top: 20px;
  font-weight: 700;
  text-align: center;
  color: #0ff;
  text-shadow: 0 0 8px #0ff;
}

/* Controls container */
#controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: center;
  background: #111;
  padding: 8px 12px;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
}

/* Buttons, selects, labels styling */
#controls select,
#controls label,
#controls button {
  padding: 6px 12px;
  font-size: 13px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  background: linear-gradient(135deg, #0ff, #0aa);
  color: #000;
  font-weight: 600;
  box-shadow: 0 0 6px #0ff;
}

#controls select:hover,
#controls label:hover,
#controls button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 12px #0ff;
}

label input[type="file"] {
  display: none;
}

/* Compact Drag & Drop area */
#drop-area {
  width: 160px;
  padding: 10px;
  border: 2px dashed #0ff;
  border-radius: 12px;
  background: #111;
  color: #0ff;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s;
}

#drop-area.hover {
  border-color: #0aa;
  background: #000;
  color: #0ff;
}

/* Collage container */
#collage {
  position: relative;
  width: 90%;
  max-width: 700px;
  height: 500px;
  border-radius: 20px;
  background: #111;
  overflow: hidden;
  box-shadow: 0 0 20px rgba(0,255,255,0.3);
  margin-top: 15px;
}

.collage-img {
  position: absolute;
  width: 150px;
  height: 150px;
  object-fit: cover;
  border-radius: 15px;
  cursor: move;
  box-shadow: 0 0 10px rgba(0,255,255,0.4);
  transition: transform 0.2s;
}

.collage-img:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(0,255,255,0.8);
}
</style>
</head>
<body>

<h1>Photo Collage</h1>

<!-- One-line controls -->
<div id="controls">
  <select id="bgPattern">
    <option value="">Background Pattern</option>
    <option value="https://www.transparenttextures.com/patterns/asfalt-dark.png">Asfalt Dark</option>
    <option value="https://www.transparenttextures.com/patterns/brick-wall.png">Brick Wall</option>
    <option value="https://www.transparenttextures.com/patterns/cubes.png">Cubes</option>
  </select>

  <label>Upload Background
    <input type="file" id="bgImageUpload" accept="image/*">
  </label>

  <div id="drop-area">📂 Drop Images</div>

  <button onclick="downloadCollage()">Download</button>
</div>

<input type="file" id="fileElem" multiple accept="image/*" style="display:none;">
<div id="collage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/interact.js/1.10.11/interact.min.js"></script>
<script>
const dropArea = document.getElementById('drop-area');
const fileElem = document.getElementById('fileElem');
const collage = document.getElementById('collage');
const bgPattern = document.getElementById('bgPattern');
const bgImageUpload = document.getElementById('bgImageUpload');

// Drag & Drop
dropArea.addEventListener('click', () => fileElem.click());
dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('hover'); });
dropArea.addEventListener('dragleave', () => dropArea.classList.remove('hover'));
dropArea.addEventListener('drop', e => { e.preventDefault(); dropArea.classList.remove('hover'); handleFiles(e.dataTransfer.files); });
fileElem.addEventListener('change', () => handleFiles(fileElem.files));

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      img.className = 'collage-img';
      img.style.left = '10px';
      img.style.top = '10px';
      collage.appendChild(img);
      enableInteract(img);
    };
    reader.readAsDataURL(file);
  });
}

// Interact.js drag/resize/rotate
function enableInteract(target) {
  interact(target)
    .draggable({
      modifiers: [interact.modifiers.restrictRect({ restriction: collage, endOnly: true })],
      listeners: { move(event) {
        const x = (parseFloat(target.dataset.x) || 0) + event.dx;
        const y = (parseFloat(target.dataset.y) || 0) + event.dy;
        const angle = parseFloat(target.dataset.angle) || 0;
        target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
        target.dataset.x = x;
        target.dataset.y = y;
      }}
    })
    .gesturable({
      listeners: { move(event) {
        const angle = (parseFloat(target.dataset.angle) || 0) + event.da;
        target.dataset.angle = angle;
        const x = parseFloat(target.dataset.x) || 0;
        const y = parseFloat(target.dataset.y) || 0;
        target.style.transform = `translate(${x}px, ${y}px) rotate(${angle}deg)`;
      }}
    })
    .resizable({
      edges: { left:true, right:true, bottom:true, top:true },
      listeners: { move(event) {
        target.style.width = event.rect.width + 'px';
        target.style.height = event.rect.height + 'px';
      }}
    });
}

// Background pattern
bgPattern.addEventListener('change', () => {
  const value = bgPattern.value;
  if(value) collage.style.background = `url(${value}) repeat`;
  else collage.style.background = '#111';
});

// Background image upload
bgImageUpload.addEventListener('change', () => {
  const file = bgImageUpload.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = e => { collage.style.background = `url(${e.target.result}) center/cover no-repeat`; };
    reader.readAsDataURL(file);
  }
});

// Download
function downloadCollage() {
  html2canvas(collage).then(canvas => {
    const link = document.createElement('a');
    link.download = 'collage.png';
    link.href = canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
